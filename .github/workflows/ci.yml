name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: c++ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: msvc-release
          - os: ubuntu-latest
            preset: gcc-release
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Before Configure: CMake needs the development headers to build the
      # xaucore extension module, and silently skips it if they are missing.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install numpy pytest

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # Compiler output is republished as ::error:: annotations. Raw job logs
      # need an authenticated token; annotations do not, so this makes a failed
      # build diagnosable from the public API instead of only in the web UI.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log; then
            exit 0
          fi
          echo "----- build failed; first errors -----"
          grep -aiE "error( C[0-9]+)?:|fatal error|undefined reference|unresolved external" build.log \
            | head -12 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                echo "::error::${clean}"
              done
          exit 1

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          if ctest --preset ${{ matrix.preset }} 2>&1 | tee test.log; then
            exit 0
          fi
          grep -aE "FAIL|Failed|error" test.log | head -12 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                echo "::notice::${clean}"
              done
          exit 1

      - name: Generate synthetic ticks
        run: python -m xau_ingest.synth --months 3 --out ../data/ticks/XAUUSD
        working-directory: python

      # Phase 0 gate: the tick reader must sustain >= 20M ticks/s on one core.
      - name: Throughput gate
        shell: bash
        run: |
          set +e
          ./build/${{ matrix.preset }}/bin/bench_tick_store data/ticks/XAUUSD XAUUSD 20000000 2>&1 | tee bench.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -aE "^gate" bench.log | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::notice::${clean}"
          done
          exit $rc

      # Phase 1 gate: a decade of ticks must backtest in under 20 s, expressed
      # as the rate that implies it (300M ticks / 20 s = 15M ticks/s).
      - name: Backtest gate
        shell: bash
        run: |
          set +e
          ./build/${{ matrix.preset }}/bin/bench_backtest data/ticks/XAUUSD XAUUSD 15000000 2>&1 | tee bt.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -aE "^gate|^expectancy|WARNING" bt.log | head -3 | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::notice::${clean}"
          done
          exit $rc

      # The bindings must agree with the C++ suite figure for figure. Copying
      # the module next to the tests avoids PYTHONPATH separator differences
      # between Windows and Linux.
      - name: Binding tests
        shell: bash
        run: |
          # GitHub runs `shell: bash` with -eo pipefail. `ls` on a glob that
          # matches nothing exits 2, which killed this step before it could say
          # anything useful. A loop with -f tests instead: an unmatched glob
          # stays literal and simply fails the test.
          out="build/${{ matrix.preset }}/python"
          mod=""
          for f in "$out"/xaucore*.pyd "$out"/xaucore*.so; do
            if [ -f "$f" ]; then mod="$f"; break; fi
          done
          if [ -z "$mod" ]; then
            echo "::error::xaucore module not found in $out; the build skipped it"
            ls -R "$out" 2>&1 || true
            exit 1
          fi
          echo "using $mod"
          cp "$mod" python/
          cd python
          if ! python -c "import xaucore; print('xaucore', xaucore.__version__)"; then
            echo "::error::import xaucore failed"
            exit 1
          fi
          set -o pipefail
          if python -m pytest tests/test_bindings.py -q --tb=line 2>&1 | tee ../bind.log; then
            tail -3 ../bind.log | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::notice::bindings: ${clean}"
            done
            exit 0
          fi
          grep -aE "^E |Error|assert|\.py:[0-9]+|failed" ../bind.log | head -10 | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::error::${clean}"
          done
          exit 1

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install numpy requests pytest
      - name: Tests
        # test_bindings.py skips here: this job never builds the extension.
        run: python -m pytest python/tests -q
      - name: End-to-end generate and verify
        run: |
          cd python
          python -m xau_ingest.synth --months 2 --out ../data/ticks/XAUUSD
          python -m xau_ingest.tickfmt ../data/ticks/XAUUSD --symbol XAUUSD
