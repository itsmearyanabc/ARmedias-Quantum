name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: c++ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: msvc-release
          - os: ubuntu-latest
            preset: gcc-release
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # Compiler output is republished as ::error:: annotations. Raw job logs
      # need an authenticated token; annotations do not, so this makes a failed
      # build diagnosable from the public API instead of only by opening the
      # web UI.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log; then
            exit 0
          fi
          echo "----- build failed; first errors -----"
          grep -aiE "error( C[0-9]+)?:|fatal error|undefined reference|unresolved external" build.log \
            | head -12 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                echo "::error::${clean}"
              done
          exit 1

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          if ctest --preset ${{ matrix.preset }} 2>&1 | tee test.log; then
            exit 0
          fi
          grep -aE "FAIL|Failed|error" test.log | head -12 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                echo "::error::${clean}"
              done
          exit 1

      # The throughput gate needs data. Generate a synthetic store, then hold
      # the reader to >= 20M ticks/s (docs/PLAN.md section 3). A regression here
      # fails the build rather than going unnoticed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate synthetic ticks
        run: |
          python -m pip install numpy
          python -m xau_ingest.synth --months 3 --out ../data/ticks/XAUUSD
        working-directory: python

      # Publishes the measured throughput as a notice annotation. The Phase 0
      # acceptance criterion is a number, so it should be readable without
      # digging through an authenticated job log.
      - name: Throughput gate
        shell: bash
        run: |
          set +e
          ./build/${{ matrix.preset }}/bin/bench_tick_store data/ticks/XAUUSD XAUUSD 20000000 2>&1 | tee bench.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -aE "M ticks/s|^gate|^files|^store" bench.log | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::notice::${clean}"
          done
          exit $rc

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install numpy requests pytest
      - name: Tests
        run: python -m pytest python/tests -q
      - name: End-to-end generate and verify
        run: |
          cd python
          python -m xau_ingest.synth --months 2 --out ../data/ticks/XAUUSD
          python -m xau_ingest.tickfmt ../data/ticks/XAUUSD --symbol XAUUSD
